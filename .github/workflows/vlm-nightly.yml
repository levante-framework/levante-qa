name: VLM nightly

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to run (default gemini; all = full matrix)'
        required: false
        type: choice
        default: gemini
        options:
          - all
          - openai
          - anthropic
          - gemini
  # schedule:
  #   # 07:00 UTC nightly.
  #   - cron: '0 7 * * *'

jobs:
  vlm:
    name: VLM agent (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, gemini]
    env:
      VLM_PROVIDER: ${{ matrix.provider }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      # version comes from package.json "packageManager" (do not also set version:)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip provider not selected
        id: gate
        run: |
          SELECTED="${{ github.event.inputs.provider }}"
          # Schedule / empty input defaults to Gemini (OpenAI and Anthropic keys are often unset).
          if [ -z "$SELECTED" ]; then
            SELECTED="gemini"
          fi
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "${{ matrix.provider }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # setup-node caches the pnpm store, not ~/.cache/Cypress. On a warm store pnpm
      # skips cypress's postinstall, so the binary must be fetched explicitly.
      - name: Ensure Cypress binary
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec cypress install

      - name: Run VLM specs
        if: steps.gate.outputs.run == 'true'
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: pnpm cy:run:vlm --env provider=${{ matrix.provider }}

      - name: Score runs
        if: steps.gate.outputs.run == 'true'
        run: pnpm score

      - name: Upload trial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vlm-logs-${{ matrix.provider }}
          path: cypress/logs
          if-no-files-found: ignore

      - name: Upload scores
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vlm-results-${{ matrix.provider }}
          path: results
          if-no-files-found: ignore
