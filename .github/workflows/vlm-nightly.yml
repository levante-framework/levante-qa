name: VLM agent

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to run (default gemini; all = full matrix)'
        required: false
        type: choice
        default: gemini
        options:
          - all
          - openai
          - anthropic
          - gemini

jobs:
  vlm:
    name: VLM agent (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, gemini]
    env:
      QA_BROWSER: chrome
      VLM_PROVIDER: ${{ matrix.provider }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      # version comes from package.json "packageManager" (do not also set version:)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip provider not selected
        id: gate
        run: |
          SELECTED="${{ github.event.inputs.provider }}"
          # Schedule / empty input defaults to Gemini (OpenAI and Anthropic keys are often unset).
          if [ -z "$SELECTED" ]; then
            SELECTED="gemini"
          fi
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "${{ matrix.provider }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # setup-node caches the pnpm store, not ~/.cache/Cypress. On a warm store pnpm
      # skips cypress's postinstall, so the binary must be fetched explicitly.
      - name: Ensure Cypress binary
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec cypress install

      - name: Run VLM specs
        if: steps.gate.outputs.run == 'true'
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: pnpm cy:run:vlm --env provider=${{ matrix.provider }}

      - name: Score runs
        if: steps.gate.outputs.run == 'true'
        run: pnpm score

      - name: Upload trial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vlm-logs-${{ matrix.provider }}
          path: cypress/logs
          if-no-files-found: ignore

      - name: Write job status
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
          RAN: ${{ steps.gate.outputs.run }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p results
          node -e 'const fs=require("fs");fs.writeFileSync("results/vlm-nightly-status.json",JSON.stringify({provider:process.env.PROVIDER,ran:process.env.RAN==="true",outcome:process.env.JOB_STATUS})+"\n")'

      - name: Upload scores
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vlm-results-${{ matrix.provider }}
          path: results
          if-no-files-found: ignore

  notify:
    name: Slack DM
    needs: vlm
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_ALERT_CHANNEL: W018924DJJV
      VLM_MATRIX_RESULT: ${{ needs.vlm.result }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: vlm-results-*
          path: artifacts

      - name: Post Slack DM
        run: node scripts/vlm-nightly-slack.mjs
