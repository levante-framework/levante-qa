name: QA (oracle)

on:
  push:
  pull_request:

jobs:
  oracle:
    name: Oracle regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # version comes from package.json "packageManager" (do not also set version:)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pin below 20.19: Node >=20.19 enables require(esm) by default, which makes
          # Cypress load cypress.config.ts via the sync-ESM path and bypass its ts-node
          # transpiler ("SyntaxError: Unexpected token ':'").
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # setup-node caches the pnpm store, not ~/.cache/Cypress. On a warm store pnpm
      # skips cypress's postinstall, so the binary must be fetched explicitly.
      - name: Ensure Cypress binary
        run: pnpm exec cypress install

      - name: Typecheck
        run: pnpm typecheck

      - name: Run oracle specs
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: pnpm cy:run:oracle

      - name: Run audio content QA
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: pnpm cy:run:audio

      - name: Upload trial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-logs
          path: cypress/logs
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
