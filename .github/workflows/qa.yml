name: QA (oracle)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  oracle:
    name: Oracle regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Pin below 20.19: Node >=20.19 enables require(esm) by default, which makes
          # Cypress load cypress.config.ts via the sync-ESM path and bypass its ts-node
          # transpiler ("SyntaxError: Unexpected token ':'").
          node-version: 20.18.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run oracle specs
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: pnpm cy:run:oracle

      - name: Run audio content QA
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: pnpm cy:run:audio

      - name: Upload trial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-logs
          path: cypress/logs
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
